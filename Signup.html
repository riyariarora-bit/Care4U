<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Care4U</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #c4b5fd;
            --primary-dark: #6d28d9;
            --accent: #ec4899;
            --accent-light: #f9a8d4;
            --bg-dark: #0f172a;
            --white: #ffffff;
            --text-main: #f8fafc;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
        }

        .shape {
            position: absolute;
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.4;
            animation: move 25s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            top: -150px;
            right: -100px;
        }

        .shape-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(-45deg, var(--accent), #3b82f6);
            bottom: -200px;
            left: -150px;
            animation-delay: -7s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: var(--primary-light);
            top: 40%;
            left: 30%;
            opacity: 0.2;
            animation-duration: 30s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(100px, 50px) scale(1.1) rotate(45deg); }
            100% { transform: translate(-50px, 100px) scale(0.9) rotate(-45deg); }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 64px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 40px 20px;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .signup-header .logo {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .signup-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(to right, #fff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .signup-header p {
            opacity: 0.6;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-wrap {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 4px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            transform: scale(1.02);
        }

        .input-wrap input, .input-wrap select {
            width: 100%;
            background: transparent;
            border: none;
            padding: 14px 20px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-signup {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 24px;
            font-size: 1.15rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 16px;
            grid-column: span 2;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .btn-signup:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 35px -10px rgba(139, 92, 246, 0.6);
            filter: brightness(1.1);
        }

        .auth-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 1rem;
            opacity: 0.6;
        }

        .auth-footer a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            margin-top: 28px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        @media (max-width: 640px) {
            .auth-card {
                padding: 48px 24px;
                border-radius: 40px;
                background: rgba(255, 255, 255, 0.01);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .btn-signup {
                grid-column: span 1;
            }
            .signup-header h1 { font-size: 2.5rem; }
        }

    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>


    <div class="auth-card">
        <div class="lang-selector" style="position: absolute; top: 40px; right: 40px; z-index: 100;">
            <select onchange="window.location.href='/set_language/' + this.value"
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 12px; cursor: pointer;">
                <option value="en" {% if current_lang=='en' %}selected{% endif %}>English</option>
                <option value="zh" {% if current_lang=='zh' %}selected{% endif %}>中国人</option>
                <option value="es" {% if current_lang=='es' %}selected{% endif %}>Español</option>
                <option value="fr" {% if current_lang=='fr' %}selected{% endif %}>Français</option>
            </select>
        </div>
        <div class="signup-header">
            <div class="logo">💊</div>
            <h1>Join Care4U</h1>
            <p>Start your journey to better health management today</p>
        </div>

        <form action="/signup" method="POST">
            <div class="form-grid">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Account Type</label>
                    <div class="input-wrap">
                        <select name="role" id="roleSelect"
                            style="width: 100%; background: transparent; border: none; color: white; padding: 14px 18px; outline: none; font-family: inherit; font-size: 0.95rem;"
                            required>
                            <option value="patient" style="background: var(--bg-dark);">Patient - I want to track my
                                health</option>
                            <option value="doctor" style="background: var(--bg-dark);">Doctor - I want to review
                                patients</option>
                        </select>
                    </div>
                </div>

                <div id="doctorFields" style="display: none; grid-column: span 2; gap: 20px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%;">
                        <div class="form-group">
                            <label>Specialization</label>
                            <div class="input-wrap">
                                <input type="text" name="specialization" placeholder="e.g. Cardiologist">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>License Number</label>
                            <div class="input-wrap">
                                <input type="text" name="license" placeholder="Med Reg No.">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrap">
                        <input type="text" name="name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Choose Username</label>
                    <div class="input-wrap">
                        <input type="text" name="username" placeholder="johndoe123" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <input type="password" name="password" placeholder="********" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <input type="email" name="email" placeholder="john@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrap">
                        <input type="tel" name="phone" placeholder="+1 234 567 890">
                    </div>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>
                    <div class="input-wrap">
                        <input type="number" name="weight" placeholder="70" step="0.1">
                    </div>
                </div>

                <div class="form-group">
                    <label>Height (cm)</label>
                    <div class="input-wrap">
                        <input type="number" name="height" placeholder="175">
                    </div>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label>City / Location</label>
                    <div class="input-wrap">
                        <input type="text" name="city" placeholder="e.g. New Delhi" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-signup">Create Account</button>
        </form>


        {% if success %}
        <div class="success-msg">{{ success }}</div>
        {% endif %}

        <div class="auth-footer">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>
    <script>
        const roleSelect = document.getElementById('roleSelect');
        const doctorFields = document.getElementById('doctorFields');

        roleSelect.addEventListener('change', () => {
            if (roleSelect.value === 'doctor') {
                doctorFields.style.display = 'grid';
            } else {
                doctorFields.style.display = 'none';
            }
        });
    </script>
</body>

</html>
